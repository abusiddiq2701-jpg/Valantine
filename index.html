<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valentine's Surprise 💝</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff7b7b, #ffccf5);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 16px;
}

/* Floating hearts background */
.bg-heart {
    position: absolute;
    bottom: -40px;
    font-size: 24px;
    opacity: 0.6;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(0) scale(1); opacity: 0.8; }
    to { transform: translateY(-120vh) scale(1.4); opacity: 0; }
}

/* Card */
#message-box {
    background: #fff;
    border-radius: 18px;
    padding: 26px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    animation: popIn 0.7s ease;
    z-index: 10;
}

@keyframes popIn {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

h1 {
    font-size: clamp(20px, 5vw, 24px);
    color: #ff2f6e;
    margin-bottom: 22px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

button {
    padding: 14px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    color: white;
    transition: transform 0.2s ease;
}

button:active {
    transform: scale(0.96);
}

#yes-btn {
    background: #ff2f92;
}

#no-btn {
    background: #ff77b7;
    position: relative;
}

/* Response */
#response-message {
    display: none;
    color: white;
    text-align: center;
    max-width: 420px;
    animation: fadeIn 0.6s ease;
    z-index: 10;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

#response-message h2 {
    font-size: clamp(18px, 4.5vw, 22px);
    line-height: 1.6;
}

#response-message img {
    max-width: 100%;
    border-radius: 14px;
    margin: 18px 0;
}

/* Heart beat */
.heart {
    font-size: 36px;
    animation: beat 1s infinite;
}

@keyframes beat {
    0% { transform: scale(1); }
    25% { transform: scale(1.25); }
    50% { transform: scale(1); }
}

/* Confetti */
.confetti {
    position: absolute;
    width: 8px;
    height: 14px;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>
<body>

<div id="message-box">
    <h1>Hey Aisha, will you be my Valentine? 💝</h1>
    <div class="buttons">
        <button id="yes-btn">Yes</button>
        <button id="no-btn">No</button>
    </div>
</div>

<div id="response-message"></div>

<script>
/* Floating hearts generator */
setInterval(() => {
    const heart = document.createElement('div');
    heart.className = 'bg-heart';
    heart.textContent = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = 6 + Math.random() * 6 + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 12000);
}, 600);

/* Runaway No button */
const noBtn = document.getElementById('no-btn');
noBtn.addEventListener('mouseenter', moveButton);
noBtn.addEventListener('touchstart', moveButton);

function moveButton() {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);
    noBtn.style.position = 'fixed';
    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
}

/* Yes button logic */
document.getElementById('yes-btn').addEventListener('click', () => {
    document.getElementById('message-box').style.display = 'none';
    const box = document.getElementById('response-message');
    box.style.display = 'block';

    box.innerHTML = `
        <h2>
            This is the best decision, Aisha! 💖😍😘💋<br><br>

            Aisha, my love, I can’t put into words how much I adore you.
            Every day with you is a blessing, and the thought of us becoming parents together
            fills my heart with so much happiness. 💞<br><br>

            I know our little one will bring us even closer, and I can’t wait to create more
            beautiful memories with you, Buddhu Ji. 🥰<br><br>

            You’re my world, Jaanu, and nothing makes me happier than knowing we’ll be raising
            our little bundle of joy together. 👶💖<br><br>

            I love you more than anything! 😘😘💋❤️
        </h2>
<img src="https://media.tenor.com/qJr03tWAvo1AAAAC/kiss-love.gif" alt="Kissing cartoon gif">
        

        <div class="heart">❤️❤️❤️</div>
    `;

    launchConfetti();
});

/* Confetti effect */
function launchConfetti() {
    for (let i = 0; i < 120; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.top = '-20px';
        c.style.background = `hsl(${Math.random() * 360},100%,60%)`;
        c.style.animationDuration = 2 + Math.random() * 3 + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
    }
}
</script>

</body>
</html>
